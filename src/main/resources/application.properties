spring.application.name=Quick Drop
spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=3073MB
spring.servlet.multipart.resolve-lazily=true
quickdrop.upload.max-concurrent=2
quickdrop.upload.temp-budget=7GB
quickdrop.upload.minimum-free-space=512MB
spring.datasource.url=jdbc:h2:file:./data/quickdrop
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Direct HTTP is the trusted-LAN default. The https profile enables native TLS.
server.ssl.enabled=false
server.forward-headers-strategy=none
quickdrop.public-base-url=${QUICKDROP_PUBLIC_BASE_URL:}
