spring.application.name=Quick Drop
# TransferLimits supplies validated defaults; override the documented keys as needed.
spring.servlet.multipart.resolve-lazily=true
spring.datasource.url=jdbc:h2:file:./data/quickdrop
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Direct HTTP is the trusted-LAN default. The https profile enables native TLS.
server.ssl.enabled=false
server.forward-headers-strategy=none
quickdrop.public-base-url=${QUICKDROP_PUBLIC_BASE_URL:}
quickdrop.network-address=${QUICKDROP_NETWORK_ADDRESS:}
