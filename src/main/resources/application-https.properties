# Activate with SPRING_PROFILES_ACTIVE=https after supplying a trusted certificate.
server.port=${QUICKDROP_HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${QUICKDROP_KEYSTORE}
server.ssl.key-store-password=${QUICKDROP_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=none
